<div class="container mt-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2>My Tasks</h2>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-primary" (click)="goToCreate()">
                + Create Task
            </button>
        </div>
    </div>

    <div *ngIf="taskService.isLoading()" class="alert alert-info">
        Loading tasks...
    </div>

    <div *ngIf="!taskService.isLoading() && taskList().length === 0" class="alert alert-warning">
        No tasks yet. Create one to get started!
    </div>

    <div class="row">
        <div class="col-md-8">
            <div *ngFor="let task of taskList()" class="card mb-3">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h5 class="card-title">{{ task.title }}</h5>
                            <p class="card-text text-muted">{{ task.description }}</p>
                            <p class="card-text">
                                <small class="text-muted">
                                    Created: {{ formatDate(task.createdAt) }}
                                </small>
                            </p>
                        </div>
                        <div>
                            <label class="visually-hidden" [for]="'status-' + task._id">
                                Update status for {{ task.title }}
                            </label>
                            <select
                                class="form-select form-select-sm"
                                [id]="'status-' + task._id"
                                [ngModel]="task.status"
                                (ngModelChange)="updateStatus(task, $event)"
                                [disabled]="updatingTaskId() === task._id"
                                [class.border-success]="task.status === 'completed'"
                                [class.border-warning]="task.status === 'pending'">
                                <option value="pending">Pending</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-sm btn-outline-primary me-2" (click)="goToEdit(task._id)">
                            Edit
                        </button>
                        <button class="btn btn-sm btn-outline-danger" (click)="deleteTask(task._id)">
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
