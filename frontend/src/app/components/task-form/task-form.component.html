<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="card-title text-center mb-4">
                        {{ isEditMode() ? 'Edit Task' : 'Create Task' }}
                    </h2>

                    <div *ngIf="errorMessage()" class="alert alert-danger">
                        {{ errorMessage() }}
                    </div>

                    <form (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title *</label>
                            <input type="text" class="form-control" id="title" [(ngModel)]="formData.title" name="title"
                                required placeholder="Enter task title" />
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" [(ngModel)]="formData.description"
                                name="description" rows="4" placeholder="Enter task description (optional)"></textarea>
                        </div>

                        <div *ngIf="isEditMode()" class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" [(ngModel)]="formData.status" name="status">
                                <option value="pending">Pending</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mb-2" [disabled]="taskService.isLoading()">
                            {{ taskService.isLoading() ? 'Saving...' : 'Save Task' }}
                        </button>

                        <button type="button" class="btn btn-secondary w-100" (click)="goBack()">
                            Cancel
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
